[workspace]
resolver = "3"
# One member per line so a package can append itself without touching a line
# someone else owns; `merge=union` in .gitattributes then never conflicts.
members = [
  "crates/*",
  "xtask",
  "tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kasecrab/liyasa"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
todo = "allow"

[profile.dev]
# Full debuginfo costs several GB per worktree across a parallel build-out;
# line tables keep backtraces useful at a fraction of the size.
debug = "line-tables-only"

# Dependencies build optimized even in dev: the test suite runs dependency code
# in its hot path (serde over a 27 MB spec corpus, syntect's regex engine over
# pathological bodies). Measured on the openapi compatibility corpus: 87.4s to
# 36.4s, 2.4x. Our own crates stay at opt-level 0 so the edit-compile cycle a
# work-package session lives in is unaffected. RFC 0005.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Shared version pins. Every row matches PRD §6.2.1; `scripts/dep-lint.py`
# compares this table with Cargo.lock. Append rows; do not edit existing ones.
[workspace.dependencies]
blake3 = { version = "1.8", default-features = false }
comrak = { version = "0.55", default-features = false }
bytes = { version = "1.12", default-features = false }
futures-core = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = { version = "1.5", default-features = false, features = ["std"] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }   # pinned exactly: 1.0 is still alpha, and its output is the theme's stylesheet (PRD §6.2.1)
markdown = { version = "1.0", default-features = false }
minijinja = { version = "2.24", default-features = false, features = ["builtins", "macros", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
schemars = { version = "1.2", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc", "rc"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serde_norway = { version = "0.9", default-features = false }
thiserror = { version = "2.0", default-features = false, features = ["std"] }
ulid = { version = "3.0", default-features = false }   # no `std`: it pulls getrandom, which has no wasm32-unknown-unknown backend. Core never mints IDs.
url = { version = "2.5", default-features = false, features = ["serde"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
jsonschema = { version = "0.56", default-features = false }
typify = { version = "0.8", default-features = false }
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }   # Vale rule tokens and the `regex` runner (RFC 1300)
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "html", "regex-fancy"] }   # fancy-regex, not oniguruma: pure Rust, no C toolchain. two-face supplies the syntaxes and themes as dumps, so `default-syntaxes`, `default-themes`, `yaml-load`, and `plist-load` stay off and their unmaintained transitives (yaml-rust, plist) stay out of the tree.
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }  # bat's curated syntax and theme set (PRD §6.2.1).
fst = { version = "0.4", default-features = false }
rust-stemmers = { version = "1.2", default-features = false }
tantivy = { version = "0.26", default-features = false, features = ["mmap"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg"] }   # the lazy image tier (PRD §6.2.1); `avif` is off until `deny.toml` allows NCSA (RFC 0604)
rayon = { version = "1.12", default-features = false }   # the only parallelism in the workspace, and never in a wasm target (PRD §6.2.1)
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }   # the dev server's file watching (PRD §6.6)
notify-debouncer-full = { version = "0.6", default-features = false }   # the 50 ms debounce window of §6.6
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }   # RFC 0900: §16's 27 commands and CLI-34's per-flag `env`
clap_complete = { version = "4.6" }   # RFC 0900: CLI-26 `liyasa completions <shell>`, generated from the same command tree
miette = { version = "7.6", features = ["fancy-no-backtrace"] }   # CLI-30 code frames (PRD §6.2.1); `fancy-no-backtrace` is the graphical renderer without the `backtrace` crate
toml = { version = "1.1" }   # RFC 0900: `liyasa.lock` only (§34.12); config is JSON and codes.toml is read by a build script
sha2 = { version = "0.11" }   # RFC 0900: §34.12 records third-party published SHA-256 digests, which blake3 cannot stand in for
ed25519-dalek = { version = "3.0" }   # RFC 0900: CLI-26 release signatures
tokio = { version = "1.53", default-features = false }   # the async runtime of liyasa-net, liyasa-store and liyasa-server (PRD §6.2.1)
axum = { version = "0.8", default-features = false }   # the HTTP server (PRD §6.2.1)
tower = { version = "0.5", default-features = false }   # axum's service layer (PRD §6.2.1)
tower-http = { version = "0.7", default-features = false }   # compression and body limits (PRD §6.2.1)
sqlx = { version = "0.9", default-features = false }   # runtime queries only; only in liyasa-store (PRD §6.2.1)
reqwest = { version = "0.13", default-features = false }   # only in liyasa-net, rustls and no_proxy() (PRD §30.2.3)
hickory-resolver = { version = "0.26", default-features = false }   # liyasa-net resolves once and pins the address (PRD §30.2.3)
rustls = { version = "0.23", default-features = false }   # TLS termination with the ring provider: aws-lc-rs carries the OpenSSL licence deny.toml does not allow (RFC 1401)
instant-acme = { version = "0.8", default-features = false }   # automatic certificates (HOST-02)
aes-gcm = { version = "0.11", default-features = false }   # the secret store's cipher (PRD §6.2.1)

# Host-only crates build unoptimised (RFC 0006). Proc macros, build scripts and
# their exclusive dependencies run once at compile time and never enter a
# binary, so RFC 0005's `package."*"` opt-level 2 was paying to optimise code
# that has no runtime. `build-override` cannot fix this: cargo's precedence is
# package.<name> > package."*" > build-override, so a build-override row loses.
#
# Every crate here was verified to have NO target consumer in the unit graph,
# following link edges only and stopping at proc-macro boundaries. Nothing is
# cross-compiled, so a crate used by both sides compiles to ONE shared unit and
# listing it would deoptimise the shipped code. serde, serde_json, schemars,
# thiserror, comrak and libc are all in that category and are deliberately
# absent. Re-derive from the unit graph before adding a row.
#
# Measured: cold `cargo build --workspace --all-targets`, sccache off, 5 jobs,
# 329s to 209s.

[profile.dev.package."async-trait"]
opt-level = 0

[profile.dev.package."autocfg"]
opt-level = 0

[profile.dev.package."bon-macros"]
opt-level = 0

[profile.dev.package."cc"]
opt-level = 0

[profile.dev.package."convert_case"]
opt-level = 0

[profile.dev.package."cssparser-macros"]
opt-level = 0

[profile.dev.package."darling"]
opt-level = 0

[profile.dev.package."darling_core"]
opt-level = 0

[profile.dev.package."darling_macro"]
opt-level = 0

[profile.dev.package."displaydoc"]
opt-level = 0

[profile.dev.package."entities"]
opt-level = 0

[profile.dev.package."find-msvc-tools"]
opt-level = 0

[profile.dev.package."futures-macro"]
opt-level = 0

[profile.dev.package."heck"]
opt-level = 0

[profile.dev.package."ident_case"]
opt-level = 0

[profile.dev.package."lightningcss-derive"]
opt-level = 0

[profile.dev.package."pastey"]
opt-level = 0

[profile.dev.package."phf_codegen"]
opt-level = 0

[profile.dev.package."phf_generator"]
opt-level = 0

[profile.dev.package."phf_macros"]
opt-level = 0

[profile.dev.package."prettyplease"]
opt-level = 0

[profile.dev.package."proc-macro2"]
opt-level = 0

[profile.dev.package."quote"]
opt-level = 0

[profile.dev.package."rand"]
opt-level = 0

[profile.dev.package."rand_core"]
opt-level = 0

[profile.dev.package."ref-cast-impl"]
opt-level = 0

[profile.dev.package."regress"]
opt-level = 0

[profile.dev.package."rustversion"]
opt-level = 0

[profile.dev.package."schemars_derive"]
opt-level = 0

[profile.dev.package."semver"]
opt-level = 0

[profile.dev.package."serde_derive"]
opt-level = 0

[profile.dev.package."serde_derive_internals"]
opt-level = 0

[profile.dev.package."shlex"]
opt-level = 0

[profile.dev.package."strsim"]
opt-level = 0

[profile.dev.package."strum_macros"]
opt-level = 0

[profile.dev.package."syn"]
opt-level = 0

[profile.dev.package."synstructure"]
opt-level = 0

[profile.dev.package."thiserror-impl"]
opt-level = 0

[profile.dev.package."typetag-impl"]
opt-level = 0

[profile.dev.package."typify"]
opt-level = 0

[profile.dev.package."typify-impl"]
opt-level = 0

[profile.dev.package."unicode-ident"]
opt-level = 0

[profile.dev.package."unicode-segmentation"]
opt-level = 0

[profile.dev.package."version_check"]
opt-level = 0

[profile.dev.package."yoke-derive"]
opt-level = 0

[profile.dev.package."zerofrom-derive"]
opt-level = 0

[profile.dev.package."zerovec-derive"]
opt-level = 0

# RFC 0900 added clap and miette, whose derive crates are proc macros with no
# target consumer and so belong under RFC 0006's rule. Note for whoever reads
# the invariant above: `strsim` and `heck` are listed as host-only and clap
# links both into the binary, so from now on those two rows deoptimise a target
# crate. Left alone rather than removed — the rows are append-only, the profile
# is dev-only, and what it costs is a fractionally slower did-you-mean on a
# mistyped flag.

[profile.dev.package."clap_derive"]
opt-level = 0

[profile.dev.package."miette-derive"]
opt-level = 0

# CLI-35 measures the release artifacts built with `lto = "fat"` and stripped.
# `profile.release` stays on thin LTO so a developer's release build is not a
# ten-minute link; `--profile dist` is what the release job uses.
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"
