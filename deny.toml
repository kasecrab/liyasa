[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Unicode-DFS-2016 is the same Unicode data licence as Unicode-3.0, which is
# already allowed; comrak reaches it through finl_unicode.
allow = [
  "Apache-2.0",
  "MIT",
  # jsonschema reaches borrow-or-share, which is MIT-0.
  "MIT-0",
  # lightningcss and its cssparser dependency are MPL-2.0: file-level copyleft,
  # which leaves Liyasa's own sources under Apache-2.0.
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
