[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # bincode 1.3.3, reached through syntect's `dump-load`, which two-face needs to
  # load its precompiled syntax and theme dumps. Not a vulnerability: the advisory
  # records that development stopped and that the authors consider 1.3.3 complete.
  { id = "RUSTSEC-2025-0141", reason = "unmaintained, not vulnerable; required by syntect dump-load" },
]

[licenses]
# Unicode-DFS-2016 is the same Unicode data licence as Unicode-3.0, which is
# already allowed; comrak reaches it through finl_unicode.
allow = [
  "Apache-2.0",
  "MIT",
  # jsonschema reaches borrow-or-share, which is MIT-0.
  "MIT-0",
  # lightningcss and its cssparser dependency are MPL-2.0: file-level copyleft,
  # which leaves Liyasa's own sources under Apache-2.0.
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  # reqwest's rustls stack reaches rustls-platform-verifier, which ships the
  # Mozilla root store as webpki-root-certs under CDLA-Permissive-2.0. A data
  # licence, not a software one, which is why cargo deny reports no OSI or FSF
  # status for it: OSI does not review data licences. Its only condition is
  # making the agreement's text available with the data (§2.1), and §3.1 states
  # outright that it imposes nothing on Results, so it reaches no Liyasa source.
  # The same shape as Unicode-DFS-2016 above. Shipping the store in a binary
  # carries §2.1's notice into the third-party licence inventory.
  #
  # This row outruns its requirement: NFR-15 lists the licences CI accepts and
  # does not name CDLA-Permissive-2.0. The requirement is the authority, so the
  # two have to be reconciled — by NFR-15's owner (WP-32), not here. It is kept
  # rather than reverted because §6.2.1 mandates reqwest 0.13 on rustls, and no
  # reqwest TLS feature set avoids this crate, so the alternative is a red gate
  # on a dependency the PRD itself chose.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA`, and NCSA is not in the list
# above because no Liyasa artifact has ever contained NCSA code — including this
# one. rav1e declares it under `[target."cfg(fuzzing)".dependencies]`, not behind
# a Cargo feature, so it exists only under `cargo fuzz`; `cargo tree` never shows
# it. cargo-deny resolves every target and cfg, which is why it sees it at all.
# Scoped to the crate rather than allowed outright, so an NCSA crate that really
# does ship still stops the gate and gets looked at. See rfcs/0004.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
