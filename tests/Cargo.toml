# The workspace's cross-crate tests: a requirement whose subject is the built
# site rather than one crate's API lives here. Shared and append-only, like the
# workspace manifest — add your `[[test]]` row, leave the others alone.

[package]
name = "liyasa-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Budget and integration tests over the built site (PRD §31.5)."
publish = false
autobins = false
autotests = false

[lints]
workspace = true

[dependencies]
liyasa-core = { path = "../crates/liyasa-core", version = "0.1.0" }
liyasa-theme = { path = "../crates/liyasa-theme", version = "0.1.0" }
# The fixture's pages are Markdown, and the reference site is what the budgets
# measure; rendering them with anything else would measure a different site.
comrak.workspace = true
# WP-01: the config crate, whose acceptance tests validate `liyasa.json`.
liyasa-config = { path = "../crates/liyasa-config", version = "0.1.0" }
serde_json.workspace = true

[[bin]]
name = "reference-site"
path = "src/bin/reference_site.rs"

[[test]]
name = "rx_12"
path = "budget/rx_12.rs"

[[test]]
name = "rx_14_transfer"
path = "budget/rx_14_transfer.rs"

[[test]]
name = "thm_31"
path = "budget/thm_31.rs"

[[test]]
name = "web_reader"
path = "web/reader.rs"

[[test]]
name = "nojs"
path = "web/nojs.rs"

[[test]]
name = "cfg_01"
path = "config/cfg_01.rs"

[[test]]
name = "cfg_04"
path = "config/cfg_04.rs"

[[test]]
name = "cfg_30_navigation"
path = "config/cfg_30_navigation.rs"

[[test]]
name = "cfg_91"
path = "config/cfg_91.rs"

[[test]]
name = "cfg_94_schema"
path = "config/cfg_94_schema.rs"
