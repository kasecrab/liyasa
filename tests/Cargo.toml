# The workspace's cross-crate tests: a requirement whose subject is the built
# site rather than one crate's API lives here. One test binary, `it/main.rs`,
# links the dependency tree once instead of once per file; add a `mod` line
# there for a new file, leave the others alone.

[package]
name = "liyasa-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Budget and integration tests over the built site (PRD §31.5)."
publish = false
autobins = false
autotests = false

[lints]
workspace = true

[dependencies]
liyasa-core = { path = "../crates/liyasa-core", version = "0.1.0" }
liyasa-theme = { path = "../crates/liyasa-theme", version = "0.1.0" }
# The fixture's pages are Markdown, and the reference site is what the budgets
# measure; rendering them with anything else would measure a different site.
comrak.workspace = true
# WP-01: the config crate, whose acceptance tests validate `liyasa.json`.
liyasa-config = { path = "../crates/liyasa-config", version = "0.1.0" }
serde_json.workspace = true
jsonschema.workspace = true
# WP-04: the component gallery the browser suite drives (`web/e2e/components/`).
liyasa-components = { path = "../crates/liyasa-components", version = "0.1.0" }
# WP-06: the build engine, whose acceptance tests are about the built site.
liyasa-build = { path = "../crates/liyasa-build", version = "0.1.0" }
liyasa-markdown = { path = "../crates/liyasa-markdown", version = "0.1.0" }
# The image fixtures are generated rather than checked in: the corpus is not committed.
image.workspace = true
# WP-14: the server under test, its store, and the outbound client. The
# acceptance tests drive the router in process with `tower::ServiceExt`
# rather than binding a port, so a test needs no listener.
liyasa-server = { path = "../crates/liyasa-server", version = "0.1.0" }
liyasa-store = { path = "../crates/liyasa-store", version = "0.1.0" }
# WP-16: the deploy routes and the recorded HTTP client the GIT-01 acceptance
# test drives instead of a network.
liyasa-git = { path = "../crates/liyasa-git", version = "0.1.0", features = ["testing"] }
liyasa-net = { path = "../crates/liyasa-net", version = "0.1.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
tower = { workspace = true, features = ["util"] }
http.workspace = true
# WP-20a: the truth graph, whose acceptance test parses a page with the
# parser the build uses and then queries the graph it produces.
liyasa-verify = { path = "../crates/liyasa-verify", version = "0.1.0" }
liyasa-cli = { path = "../crates/liyasa-cli", version = "0.1.0" }
clap.workspace = true

[[bin]]
name = "reference-site"
path = "src/bin/reference_site.rs"

[[bin]]
name = "docs-reference"
path = "src/bin/docs_reference.rs"

[[test]]
name = "it"
path = "it/main.rs"
