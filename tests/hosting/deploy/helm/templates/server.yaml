{{- if and (gt (int .Values.replicaCount) 1) (not .Values.postgres.enabled) }}
{{- fail "replicaCount above 1 requires postgres.enabled: replicas coordinate through the job store, and SQLite is one node's file (HOST-03)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: liyasa
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: liyasa
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: liyasa
        app.kubernetes.io/component: server
    spec:
      # Matches server.drainTimeout with room for the flush and the lease
      # release (NFR-31).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen
            - {{ .Values.server.listen | quote }}
            - --json-logs
          ports:
            - name: http
              containerPort: 8080
          env:
            # The pod name, so each replica is a distinct worker in the job
            # table and its leases can be told apart.
            - name: LIYASA_WORKER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LIYASA_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKey.existingSecret }}
                  key: {{ .Values.masterKey.key }}
          # Liveness restarts a stuck process; readiness takes a draining or
          # storeless replica out of rotation without restarting it (HOST-05).
          livenessProbe:
            httpGet:
              path: /_liyasa/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_liyasa/ready
              port: http
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
spec:
  selector:
    app.kubernetes.io/name: liyasa
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-server
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: liyasa
      app.kubernetes.io/component: server
{{- end }}
