# nginx in front of `liyasa serve` (HOST-04), including a subpath.
#
# The forwarded headers matter twice over: the limiter keys on the client
# address (§30.2.5) and the region header is only honoured from a trusted
# proxy (AUTH-50). Set `server.trustedProxies` to this proxy's address, or the
# server ignores everything below and charges the proxy itself.

upstream liyasa {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name docs.example.com;

    ssl_certificate     /etc/ssl/certs/docs.example.com.pem;
    ssl_certificate_key /etc/ssl/private/docs.example.com.key;

    # The server sends its own security headers (RX-112); adding a second set
    # here would produce two of each.
    proxy_hide_header X-Powered-By;

    location / {
        proxy_pass http://liyasa;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # A documentation server answers whole bodies; buffering them only
        # adds latency, and AUTH-14 forbids holding one open.
        proxy_buffering off;
        proxy_read_timeout 60s;

        # `Accept: text/markdown` must reach the server intact (RX-60), and
        # the response varies on it.
        proxy_set_header Accept $http_accept;
    }
}

# Subpath hosting (HOST-22): the site is built with `build.basePath: "/docs"`,
# so the prefix is passed through rather than stripped. Stripping it would
# make every link in the page point outside the location.
server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/ssl/certs/example.com.pem;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    location /docs/ {
        proxy_pass http://liyasa;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_buffering off;
    }
}
