# Traefik static configuration (HOST-04).
#
# The dynamic half is traefik-dynamic.yml. Set `server.trustedProxies` to the
# Traefik container's address, or the server charges Traefik for every reader.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    # Traefik terminates TLS, so the server behind it speaks plain HTTP.
    http:
      tls:
        certResolver: letsencrypt
    # The drain window of NFR-31: let in-flight requests finish.
    transport:
      lifeCycle:
        graceTimeOut: 45s

providers:
  file:
    filename: /etc/traefik/traefik-dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@example.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO
accessLog: {}
