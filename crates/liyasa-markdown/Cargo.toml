[package]
name = "liyasa-markdown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Liyasa Markdown: segmentation, expansion, directives, and the Rendered AST (PRD §7.5, §7.16)."

[lints]
workspace = true

[dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0" }
minijinja = { workspace = true, features = ["debug", "fuel", "loader", "multi_template"] }
serde.workspace = true
serde_json.workspace = true
# `shortcodes` reaches the `emojis` table for CM-41; PRD §6.2.1 carries the row.
comrak = { workspace = true, features = ["shortcodes"] }
