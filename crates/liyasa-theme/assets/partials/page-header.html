<div class="ly-page-header" data-liyasa="page-header">
  <h1 class="ly-page-title" data-liyasa="page-title">{{ page.title }}</h1>
  {% if page.description %}<p class="ly-page-description" data-liyasa="page-description">{{ page.description }}</p>{% endif %}
  {% if page.lastModified %}<p class="ly-page-meta" data-liyasa="last-modified">{{ strings.lastUpdated }} {{ page.lastModified }}</p>{% endif %}
</div>
