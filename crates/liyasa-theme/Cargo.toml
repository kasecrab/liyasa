[package]
name = "liyasa-theme"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The default theme: tokens, partials, layouts, and the reader runtime (PRD §10, §11)."

[lints]
workspace = true

[dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0" }
lightningcss.workspace = true
# `multi_template` adds `{% extends %}` and `{% include %}`, which is how a
# page is assembled from partials (THM-20) and how a layout is overridden
# (THM-21). Features are additive, so the workspace row is untouched.
minijinja = { workspace = true, features = ["multi_template"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0", features = ["conformance"] }
