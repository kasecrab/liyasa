[package]
name = "liyasa-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Store contract over SQLite: migrations, the job table with leases, the secret store, and the analytics ingest queue (PRD §6.8, §6.13, ANA-08)."

[lints]
workspace = true

[dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
ulid = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "time", "sync", "fs", "macros"] }
# Runtime queries only (PRD §6.2.1): no `macros`, so no compile-time database.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
aes-gcm = { workspace = true, features = ["aes", "alloc"] }
# Already in the graph (ring, ulid); the secret store's nonces and the daily
# analytics salt need cryptographic randomness (RFC 1401).
getrandom = { version = "0.3", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0", features = ["conformance"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
