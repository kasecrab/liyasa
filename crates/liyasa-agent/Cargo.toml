[package]
name = "liyasa-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The writing agent: trust levels, the tool surface, the output gates, and the policy engine (PRD §30.2.2, §31)."

[lints]
workspace = true

[dependencies]
liyasa-ai = { path = "../liyasa-ai", version = "0.1.0" }
liyasa-core = { path = "../liyasa-core", version = "0.1.0" }
futures-core.workspace = true
jsonschema.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[features]
# A scripted model and an in-memory page tree, for this crate's own tests and for
# the acceptance tests in `tests/agent/`. Behind a feature so neither reaches a
# shipped binary; `tests/Cargo.toml` turns it on as a dev-dependency, the same way
# it does for `liyasa-git`.
testing = []

[dev-dependencies]
liyasa-agent = { path = ".", version = "0.1.0", features = ["testing"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
