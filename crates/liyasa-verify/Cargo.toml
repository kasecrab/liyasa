[package]
name = "liyasa-verify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The verification engine: in-process runners, link and structural checks, prose lint, output scrubbing, and the report formats (PRD §14, §30.2.4)."

[lints]
workspace = true

[features]
# Off by default. Turning it on lets a rule package **from the trust plane**
# use regex look-around, which takes Google's and Microsoft's styles from 67
# of 83 rules to 81 (RFC 1307). An untrusted package never reaches the
# backtracking engine whether this is on or off, and with it off the build is
# byte-identical to one before the feature existed.
#
# Making it default needs a PRD §6.2.1 row, which is above this package;
# `NEEDS-INPUT.md` carries the ask.
fancy = ["dep:fancy-regex"]

[dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0" }
# WP-20c: `content.reviewCadence` has two schema forms and `review_cadence`
# unfolds both, so drift never branches on which one an operator wrote — and
# `review::normalize` is the normalisation W0140's check uses, so an override
# warned about there is the same route set matched here. Adds no crate to the
# graph: liyasa-config's own dependencies are liyasa-core, jsonschema, schemars,
# serde and serde_json, and this crate already has every one.
liyasa-config = { path = "../liyasa-config", version = "0.1.0" }
jsonschema.workspace = true
schemars.workspace = true
regex.workspace = true
# Already in the tree twice at these exact versions — 0.16.2 through syntect's
# `regex-fancy` feature, 0.19.2 through `jsonschema`, which this crate already
# depends on directly — so this adds no crate to the graph. Pinned here rather
# than in `[workspace.dependencies]` because the root manifest is not this
# package's to add a table row to.
fancy-regex = { version = "0.19.2", optional = true }
serde.workspace = true
# WP-20b: VER-25 names a `command` source by the SHA-256 of its script, and the
# allow list is written in those digests. `blake3` cannot stand in for one.
sha2.workspace = true
zeroize.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
ulid.workspace = true
url.workspace = true

[dev-dependencies]
liyasa-core = { path = "../liyasa-core", version = "0.1.0", features = ["conformance"] }
