# Liyasa diagnostic code registry (PRD §34.5).
#
# APPEND ONLY. Claim a code by adding one line to [codes] in your area's
# range; never edit or remove an existing line. One line per row keeps the
# `merge=union` attribute in .gitattributes conflict-free.
#
# severity is the default; policy may promote or demote it. The prefix must
# agree with it (E = error, W = warning) and a number is never reused across
# prefixes. `url` defaults to https://kasecrab.github.io/liyasa/docs/errors/<code>.
#
# `cargo test -p liyasa-core registry` rejects duplicates, out-of-range codes,
# prefix/severity disagreement, and numbers reused across prefixes.

[ranges]
"0001-0099" = { area = "CLI and I/O", crate = "liyasa-cli" }
"0100-0199" = { area = "Configuration", crate = "liyasa-config" }
"0200-0299" = { area = "Templating and Source Document", crate = "liyasa-markdown" }
"0300-0349" = { area = "Markdown, directives", crate = "liyasa-markdown" }
"0350-0399" = { area = "Components", crate = "liyasa-components" }
"0400-0499" = { area = "Navigation and links", crate = "liyasa-build" }
"0500-0599" = { area = "OpenAPI and API docs", crate = "liyasa-openapi" }
"0600-0699" = { area = "Verification and facts", crate = "liyasa-verify" }
"0700-0799" = { area = "Build, cache, assets, determinism", crate = "liyasa-build" }
"0800-0899" = { area = "Server, auth, deployments, network", crate = "liyasa-server" }
"0900-0999" = { area = "AI, agent, automations", crate = "liyasa-ai" }
"1000-1099" = { area = "Search and the browser index", crate = "liyasa-search" }

