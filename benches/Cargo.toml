# The release benchmark suite (NFR-01): the §6.6 figures, measured at 100,
# 1,000 and 10,000 pages and published in the changelog.
#
# Not a `criterion` harness. Every figure here is a whole-site build measured
# once or a handful of times — the 10,000-page row is a ninety-second budget —
# so the statistics criterion exists for would cost hours to buy nothing. It is
# a binary that writes a JSON record and a Markdown table, plus a library so
# the tests can drive the same code.

[package]
name = "liyasa-benches"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
autotests = false
description = "The release benchmark suite: the PRD §6.6 build figures at 100, 1,000 and 10,000 pages."

[lints]
workspace = true

[lib]
name = "liyasa_benches"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
# The engine under measurement, reached exactly as `liyasa build` reaches it.
liyasa-build = { path = "../crates/liyasa-build", version = "0.1.0" }
liyasa-config = { path = "../crates/liyasa-config", version = "0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# An integration test links the crate's dev-dependencies, not its own, and the
# tests read the generated config back as JSON to prove it is one.
serde_json.workspace = true
