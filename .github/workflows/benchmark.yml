name: benchmark

# NFR-01: the §6.6 build figures, measured at 100, 1,000 and 10,000 pages and
# published. The job summary is where a release note copies the table from.
#
# Not on every pull request. A shared runner's throughput moves by tens of
# percent between runs, so a per-commit graph of these numbers would be a graph
# of the fleet's noise; the requirement asks for a measurement per release.

on:
  workflow_dispatch:
    inputs:
      sizes:
        description: The page counts to measure, comma-separated.
        default: "100,1000,10000"
      strict:
        description: Fail the run when a §6.6 budget is missed.
        type: boolean
        default: false
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  measure:
    runs-on: ubuntu-latest
    # The 10,000-page row alone has a ninety-second budget and is measured
    # clean, warm, edited and reconfigured.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Release, always. A debug build measures rustc's inlining decisions, and
      # the figures come out several times over budget for reasons that have
      # nothing to do with the engine.
      # Redirect rather than `| tee`: the default shell does not set
      # `pipefail`, so a missed budget under `--strict` would exit through
      # `tee` and report success. Progress goes to stderr and still shows in
      # the log.
      - name: Measure
        run: |
          cargo run --release -p liyasa-benches --bin bench -- run \
            --sizes "${{ inputs.sizes || '100,1000,10000' }}" \
            --out bench.json \
            ${{ (inputs.strict || github.event_name == 'release') && '--strict' || '' }} \
            > bench.md
      # A budget the runner cannot judge reports "not applicable" rather than
      # passing: ubuntu-latest has four cores and §6.6's 10,000-page figure is
      # written for eight, so that row is a measurement here and not a verdict.
      - name: Publish the table
        if: always()
        run: |
          {
            echo "## Build benchmark (NFR-01, PRD §6.6)"
            echo
            cat bench.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark
          path: |
            bench.json
            bench.md
