name: platforms

# NFR-41: Linux (glibc and musl, x86_64 and aarch64), macOS 13+, Windows 10+
# for the CLI, with the server on Windows best effort.
#
# `cargo check`, not `cargo test`: a target Liyasa cannot run its suite on —
# every one of these but the host — would otherwise need an emulator per job to
# prove nothing the host has not already proved. What this catches is a
# dependency that does not exist off Linux, a `cfg` that forgot a platform, and
# a path assumption in a build script.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/platforms.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          # This job is `cargo check --target`, so the runner's own
          # architecture does not have to match the target — the same reason
          # the musl and aarch64 targets build on x86_64 Linux. It was pinned
          # to `macos-13` to pit the check against the oldest macOS the
          # requirement names, but GitHub has retired that image: the job then
          # queues for a runner that will never come, and a queued job reports
          # an empty conclusion, which reads as passing. This push's sat
          # queued while the other six passed, and the dependabot run before
          # it had been waiting 16h18m.
          #
          # What was lost is small and was never much: a `cargo check` on a
          # newer runner proves the x86_64 Darwin target still compiles, which
          # is all the other cross-targets prove. It never proved the macOS 13
          # floor at runtime, because nothing here runs.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          # "Windows 10+ (CLI; server on Windows is best effort)", so the
          # Windows job builds the CLI and what it needs, and nothing else.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            packages: "-p liyasa-cli"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl links through the gnu driver, which needs the cross linker even
      # for the host architecture.
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo check ${{ matrix.packages || '--workspace' }} --all-targets --target ${{ matrix.target }}
